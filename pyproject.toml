[project]
name = "helzer-vps"
version = "0.1.0"
description = "Discord-only AI powered Docker VPS hosting manager"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.6,<3",
  "docker>=7,<8",
  "pydantic-settings>=2,<3",
  "SQLAlchemy>=2,<3",
  "aiosqlite>=0.21,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
